# Drop-in that permits package and kernel maintenance.
#
# Install as:
#   /etc/systemd/system/rcc-node-agent.service.d/package-maintenance.conf
#
# WHY THIS IS A SEPARATE FILE
#
# The base unit sandboxes the agent hard: the filesystem is read-only apart from
# its own state directory, and capabilities are reduced to CAP_SYS_BOOT. That is
# what makes running as root defensible for Stage 1 and Stage 2, where the agent
# reads the journal, restarts one allowlisted unit, and reboots.
#
# apt cannot run inside that. Installing a package writes to /usr, /etc, /boot,
# /var/lib/dpkg and /var/cache/apt, and maintainer scripts change ownership and
# drop privileges. There is no honest way to keep the Stage 2 sandbox and also
# install packages.
#
# So the widening is a deliberate, separate act. Enabling ordinary package
# maintenance takes two things that a person has to do on purpose:
#
#   1. `packagesEnabled: true` in the agent configuration
#   2. this drop-in installed on the host
#
# Without the drop-in, apt fails and the operation fails closed — visibly, with
# a permission error in the receipt — rather than the platform quietly running
# with a weaker sandbox on every host that has the binary installed.
#
# The governed `ssh.protection.enable` operation reuses this drop-in because its
# fixed workflow may install fail2ban and must write one fixed file below /etc.
# That does NOT grant SSH authority by itself. SSH setup separately requires
# operationsEnabled, collectSSHBan, sshBanEnabled, at least one exact protected
# management address, console permission, a second administrator, policy and an
# open maintenance window. Conversely those gates do not widen this sandbox.
# Both sides must be enabled deliberately or the operation fails closed.
#
# WHAT IS STILL NARROWED
#
# Even here the agent does not get ordinary root:
#   - no listening socket, and the outbound-only design is unchanged
#   - ProtectHome, PrivateDevices, RestrictNamespaces, LockPersonality stay
#   - the address families stay restricted
#   - @mount, @swap and @obsolete syscalls stay denied
#   - there is still no shell and no arbitrary command path in the agent itself
#
# What it does get is the ability to install packages, which is the operation
# being enabled. That is not a subset of anything smaller.

# WHAT A DROP-IN CANNOT ISOLATE
#
# systemd merges drop-ins into one unit. CapabilityBoundingSet, ReadWritePaths
# and SystemCallFilter all union across every drop-in installed, so a host
# carrying this file and a Stage 4 one runs the agent with the union of both.
# What stays separate is the authority itself: which operations the agent
# accepts is decided by the configuration flags, the console permissions and the
# package allowlist or the independent SSH protection gates, none of which
# another drop-in touches.

[Service]
# Paths a package transaction genuinely needs. ProtectSystem=strict is inherited
# from the base unit and deliberately not relaxed: a maintainer script that
# writes outside this list fails, visibly, rather than writing wherever it likes.
# That is a real operational cost — a package whose scripts touch an unlisted
# path will fail to install and the path has to be added here on purpose — and
# it is the point.
ReadWritePaths=/var/lib/dpkg
ReadWritePaths=/var/lib/apt
ReadWritePaths=/var/cache/apt
ReadWritePaths=/var/lib/systemd
ReadWritePaths=/var/log
ReadWritePaths=/var/run
ReadWritePaths=/etc
ReadWritePaths=/usr
ReadWritePaths=/boot

# Maintainer scripts change file ownership and drop to unprivileged users.
# CAP_SYS_BOOT is retained because host.reboot is still a declared operation.
CapabilityBoundingSet=CAP_SYS_BOOT CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_FSETID CAP_SETUID CAP_SETGID CAP_MKNOD CAP_AUDIT_WRITE

# This must be a positive entry. systemd merges the syscall filter across
# drop-ins and a `~` list only ever subtracts from what is already allowed, so a
# deny-list here could never restore a group the base unit denied — it would
# read as a widening and do nothing. @privileged covers the chown and setuid
# family that maintainer scripts use; @module is needed because installing a
# kernel package runs depmod. @mount, @resources, @swap and @obsolete are
# deliberately left denied by the base filter.
SystemCallFilter=@privileged @module

# A package's maintainer scripts are vendor code that runs as root. This is
# inherent to package management on Debian and Ubuntu, not something this
# platform introduces or can constrain: the agent chooses which packages, and
# the distribution decides what installing one does. It is the reason the
# package allowlist and the built-in critical-package denylist exist, and it is
# stated as a residual risk in the manual rather than papered over.
MemoryDenyWriteExecute=no

# A kernel package unpacks an initramfs, which is memory-hungry, and dpkg forks
# a maintainer script per package.
MemoryMax=2G
TasksMax=512
CPUQuota=80%

# apt is slow on a large upgrade, and being killed mid-transaction leaves dpkg
# needing manual repair. The agent's own timeouts bound the operation; this only
# stops systemd from intervening first.
TimeoutStopSec=30min
