# Drop-in that permits conservative storage changes.
#
# Install as:
#   /etc/systemd/system/rcc-node-agent.service.d/storage-maintenance.conf
#
# WHY THIS IS A SEPARATE FILE
#
# The base unit denies the @mount syscall group outright and makes the
# filesystem read-only apart from the agent's own state. Neither mounting a
# filesystem nor writing a mount unit is possible inside that.
#
# So the widening is a deliberate, separate act. Enabling storage operations
# takes three things a person has to do on purpose:
#
#   1. `storageEnabled: true` in the agent configuration
#   2. `storageMountRoots` and/or `storageGrowAllowlist` naming what may change
#   3. this drop-in installed on the host
#
# Without the drop-in, the mount fails and the operation fails closed —
# visibly, with a permission error in the receipt.
#
# WHAT THIS STILL CANNOT DO
#
# There is no code path in the agent that formats a filesystem, writes a
# partition table, shrinks anything, or edits /etc/fstab. Those are not refused
# at runtime; they cannot be expressed. The two operations are:
#
#   mount.configure   generate a systemd .mount unit for an existing filesystem,
#                     named by its own UUID, beneath an allowlisted root
#   filesystem.grow   grow a mounted ext4 or xfs filesystem to fill the block
#                     device it already sits on
#
# Neither takes a size, a device path, a mount option string or a tool argument
# from the request. resize2fs and xfs_growfs are invoked with the mount point
# alone, which means "use all of the device"; neither can shrink a mounted
# filesystem at any invocation this agent could construct.
#
# The root filesystem, /boot, /usr, /etc, /var and everything holding cluster,
# Supabase, Gitea or PersistentVolume data are protected in the agent's own
# code, not only in configuration, so an allowlist entry cannot re-enable them.
#
# WHAT IS STILL NARROWED
#
#   - no listening socket; the outbound-only design is unchanged
#   - ProtectSystem=strict from the base unit is kept, so everything outside the
#     four paths named below stays read-only
#   - ProtectHome, RestrictNamespaces and LockPersonality stay
#   - the base syscall filter is untouched: @privileged, @resources, @mount,
#     @swap, @module and @obsolete all stay denied
#   - the address families stay restricted
#   - there is still no shell and no arbitrary command path in the agent
#
# WHAT A DROP-IN CANNOT ISOLATE
#
# systemd merges drop-ins into one unit. CapabilityBoundingSet and
# ReadWritePaths are list-valued and union across every drop-in installed, so a
# host carrying both this file and osimage-maintenance.conf runs the agent with
# the union of both. What stays separate is the authority itself: which
# operations the agent will accept is decided by the configuration flags, the
# console permissions and the allowlists, and none of those is affected by
# another drop-in being present.

[Service]
# Where a generated mount unit lives, and where mount points may be created.
# An operator using a different root must add it here as well as to
# storageMountRoots; both gates apply.
#
# ProtectSystem=strict is inherited from the base unit and deliberately not
# relaxed here: these four paths are the whole of what this authority may write.
ReadWritePaths=/etc/systemd/system
ReadWritePaths=/srv
ReadWritePaths=/mnt
ReadWritePaths=/data

# The agent never calls mount(2) itself. It writes a unit and asks PID 1 to
# start it, so no mount capability or @mount syscall is needed here.
#
# Growing is different: it is an ioctl the agent's own child process issues.
#   CAP_SYS_RESOURCE  ext4 online resize (EXT4_IOC_RESIZE_FS)
#   CAP_SYS_ADMIN     xfs online grow (XFS_IOC_FSGROWFSDATA)
# CAP_SYS_ADMIN is the widest capability any Stage 4 authority grants, which is
# why this is the drop-in to think hardest about before installing.
# CAP_SYS_BOOT is retained because host.reboot is still a declared operation.
CapabilityBoundingSet=CAP_SYS_BOOT CAP_SYS_ADMIN CAP_SYS_RESOURCE CAP_DAC_OVERRIDE

# No SystemCallFilter line here on purpose. systemd merges the filter across
# drop-ins, and a `~` list only ever subtracts from what is already allowed: it
# cannot restore a group the base unit denied. Re-permitting a group needs a
# positive entry, and neither mounting through PID 1 nor an ioctl needs one.

# Growing a large filesystem is slow, and being killed partway through leaves
# resize2fs needing a manual fsck. The agent's own timeout bounds the operation;
# this only stops systemd from intervening first.
TimeoutStopSec=20min
MemoryMax=512M
