# Drop-in that permits staging an operating system image.
#
# Install as:
#   /etc/systemd/system/rcc-node-agent.service.d/osimage-maintenance.conf
#
# This applies only to image-based hosts — rpm-ostree or bootc. On a
# package-managed distribution such as the Ubuntu CC2 runs, the agent reports
# the boot model as mutable and refuses both image operations, so installing
# this file there grants nothing and is simply unnecessary.
#
# WHY THIS IS A SEPARATE FILE
#
# Writing a new deployment means unpacking an image into /ostree or /sysroot and
# updating the bootloader entries. The base unit's read-only filesystem makes
# that impossible, which is the correct default for every host that is not doing
# it.
#
# So the widening is a deliberate, separate act. Enabling image operations takes
# three things a person has to do on purpose:
#
#   1. `osImageEnabled: true` in the agent configuration
#   2. an `osImageAllowlist` of digest-pinned references
#   3. this drop-in installed on the host
#
# WHAT THIS STILL CANNOT DO
#
# Neither operation reboots, and neither can be asked to. `rebootAfter` is
# declared on the wire, always false, and refused by the request grammar, by the
# plan validator and by the executor. Staging writes a deployment and stops; the
# running system does not change until host.reboot is separately requested and
# approved, and that path carries the Kubernetes drain, PDB and etcd checks this
# one deliberately does not have.
#
# The image reference is digest-pinned and must appear in both the maintenance
# policy's allowlist and the host's own. There is no field for a registry, a
# tag, a transport or a URL: a tag can be moved by whoever controls the
# registry, which makes it a target nobody can review.
#
# RESIDUAL RISK
#
# A staged image is somebody else's operating system, and this platform verifies
# that it is the digest that was approved — not that the contents of that digest
# are safe. That is the same trust boundary as any image-based system and it is
# stated as a residual risk in the manual rather than papered over.

# WHAT A DROP-IN CANNOT ISOLATE
#
# systemd merges drop-ins into one unit. CapabilityBoundingSet, ReadWritePaths
# and SystemCallFilter all union across every drop-in installed, so a host
# carrying both this file and storage-maintenance.conf runs the agent with the
# union of both. This is the widest of the drop-ins; installing it alongside
# another does not narrow it. What stays separate is the authority itself:
# which operations the agent accepts is decided by the configuration flags, the
# console permissions and the image allowlist, none of which another drop-in
# touches.

[Service]
# The deployment root and the bootloader entries. ProtectSystem=strict is
# inherited from the base unit and deliberately not relaxed: /usr, /etc and
# everything else outside this list stay read-only, and ostree writes to
# /sysroot and /boot instead.
ReadWritePaths=/sysroot
ReadWritePaths=/ostree
ReadWritePaths=/boot
ReadWritePaths=/var/lib/containers
ReadWritePaths=/var/cache

# Unpacking an image creates device nodes and changes ownership, and composes
# the deployment root out of mounts. CAP_SYS_BOOT is retained because
# host.reboot is still a declared operation.
CapabilityBoundingSet=CAP_SYS_BOOT CAP_SYS_ADMIN CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_FSETID CAP_MKNOD CAP_SETUID CAP_SETGID

# These two must be positive entries. systemd merges the syscall filter across
# drop-ins and a `~` list only ever subtracts from what is already allowed, so a
# deny-list here could never restore a group the base unit denied — it would
# read as a widening and do nothing. @swap, @resources, @module and @obsolete
# are deliberately left denied by the base filter.
SystemCallFilter=@mount @privileged

# Pulling an operating system image is slow on any link worth having, and being
# killed partway leaves a half-written deployment for the adapter to clean up.
TimeoutStopSec=60min
MemoryMax=4G
TasksMax=512
