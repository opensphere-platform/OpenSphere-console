# Drop-in that permits network reconfiguration.
#
# Install as:
#   /etc/systemd/system/rcc-node-agent.service.d/network-maintenance.conf
#
# WHY THIS IS A SEPARATE FILE
#
# The base unit reduces the agent to CAP_SYS_BOOT and a read-only filesystem.
# nmcli cannot reconfigure a connection inside that: NetworkManager's client
# talks to the daemon over D-Bus and the profile it writes lives under
# /etc/NetworkManager.
#
# So the widening is a deliberate, separate act. Enabling network operations
# takes three things a person has to do on purpose:
#
#   1. `networkEnabled: true` in the agent configuration
#   2. a `networkAllowlist` naming the connection profiles that may change
#   3. this drop-in installed on the host
#
# Without the drop-in, nmcli fails and the operation fails closed — visibly,
# with a permission error in the receipt — rather than the platform quietly
# running with a weaker sandbox on every host that has the binary installed.
#
# WHAT THIS STILL CANNOT DO
#
# The interface carrying the default route to the control center is refused
# three times over: by the request grammar, by the backend against the reported
# inventory, and by the agent against the live routing table at execution time.
# There is no configuration in this file, or anywhere else, that relaxes that.
#
# Every change is also reverted automatically unless the agent can reach its own
# control center afterwards. A host that loses its way back is put back the way
# it was, including after a crash: the undo record is written to durable state
# before the change is applied.
#
# WHAT IS STILL NARROWED
#
#   - no listening socket; the outbound-only design is unchanged
#   - ProtectSystem=strict from the base unit is kept, so everything outside the
#     one path below stays read-only
#   - ProtectHome and LockPersonality stay
#   - the base syscall filter is untouched: @privileged, @resources, @mount,
#     @swap, @module and @obsolete all stay denied
#   - there is still no shell and no arbitrary command path in the agent
#   - CAP_NET_RAW is deliberately NOT granted: nothing here sends raw packets
#
# WHAT A DROP-IN CANNOT ISOLATE
#
# systemd merges drop-ins into one unit. CapabilityBoundingSet, ReadWritePaths
# and RestrictAddressFamilies are list-valued and union across every drop-in
# installed, so a host carrying this file and a storage or image one runs the
# agent with the union of all of them. What stays separate is the authority
# itself: which operations the agent accepts is decided by the configuration
# flags, the console permissions and the connection allowlist, none of which
# another drop-in touches.

[Service]
# NetworkManager stores connection profiles here. ProtectSystem=strict is
# inherited from the base unit and deliberately not relaxed: this is the only
# path this drop-in makes writable.
ReadWritePaths=/etc/NetworkManager

# CAP_NET_ADMIN is what changing an address, a route or an MTU needs.
# CAP_SYS_BOOT is retained because host.reboot is still a declared operation.
CapabilityBoundingSet=CAP_SYS_BOOT CAP_NET_ADMIN

# No SystemCallFilter line here on purpose. nmcli asks the NetworkManager daemon
# to make the change over D-Bus and does not issue a privileged syscall itself,
# so the base filter is sufficient. A `~` list would in any case only subtract
# from what is already allowed: systemd merges the filter across drop-ins and a
# deny-list can never restore a group the base unit denied.

# nmcli talks to NetworkManager over a D-Bus system socket, which is AF_UNIX,
# and that family is already permitted by the base unit. AF_NETLINK is added
# because reading link state goes through it.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

# Bringing a connection up can involve DHCP, and the agent waits out its own
# rollback window afterwards. This only stops systemd from intervening first;
# the agent's own timeouts still bound the operation.
TimeoutStopSec=15min
