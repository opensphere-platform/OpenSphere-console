apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local edge release declaration. Deployment consumes the exact GHCR digest;
# tags are publication references only and are never used by Kubernetes.
resources:
  - opensphere-console-dupa-controller.yaml

images:
