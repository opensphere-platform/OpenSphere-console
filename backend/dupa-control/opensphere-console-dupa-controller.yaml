apiVersion: v1
kind: Namespace
metadata:
  name: opensphere-console
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensphere-console-dupa-controller
  namespace: opensphere-console
---
# controller??opensphere-console ?덉뿉?쒕쭔 ?뚰겕濡쒕뱶/CRD瑜?議곗젙 (理쒖냼沅뚰븳)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-console-dupa-controller
  namespace: opensphere-console
rules:
  - apiGroups: ["plugins.opensphere.io"]
    # uipluginpackages/finalizers: workload ownerReference??blockOwnerDeletion=true ?ㅼ젙???꾩슂
    #   (OwnerReferencesPermissionEnforcement admission??owner finalizers update 沅뚰븳???붽뎄 ???놁쑝硫?workload ?앹꽦 嫄곕?)
    resources: [uipluginpackages, uipluginpackages/finalizers, uipluginregistrations, uipluginregistrations/status]
    # delete: uninstall ??registration CR ?뚯닔 (?놁쑝硫?CR??Removed濡??붾쪟 ??UX??'??젣 ????)
    verbs: [get, list, watch, create, update, patch, delete]
  # Main Shell-owned lifecycle declaration/evidence between HIS and PFS.
  - apiGroups: ["platform.opensphere.io"]
    resources: [platformsupportprofiles, platformsupportprofiles/status]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, serviceaccounts, configmaps, secrets, pods]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-console-dupa-controller
  namespace: opensphere-console
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-dupa-controller }
subjects:
  - kind: ServiceAccount
    name: opensphere-console-dupa-controller
    namespace: opensphere-console
---
# Platform Delivery evidence is read-only and namespace-scoped. The controller
# reads only the canonical Argo CD runtime, Application and AppProject; it
# cannot mutate runtime or desired state.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dupa-platform-delivery-evidence-reader
  namespace: argocd
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    resourceNames: [argocd-repo-server, argocd-server, argocd-applicationset-controller]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [statefulsets]
    resourceNames: [argocd-application-controller]
    verbs: [get]
  - apiGroups: ["argoproj.io"]
    resources: [applications, appprojects]
    resourceNames: [opensphere-platform-delivery-verify, opensphere-platform-delivery]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dupa-platform-delivery-evidence-reader
  namespace: argocd
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dupa-platform-delivery-evidence-reader }
subjects:
  - kind: ServiceAccount
    name: opensphere-console-dupa-controller
    namespace: opensphere-console
---
# The canonical admission red-test proves the CronJob image-integrity policy by
# replaying the backup CronJob through a server dry-run.  Kubernetes charges a
# dry-run PUT against the `update` verb, and this workload lives outside the
# Console namespace, so the evidence path needs its own binding.  Both verbs are
# pinned to the single red-test subject: the controller can reach no other
# CronJob, and it only ever issues the request with `dryRun=All`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dupa-security-red-test-cronjob
  namespace: opensphere-console-data
rules:
  - apiGroups: ["batch"]
    resources: [cronjobs]
    resourceNames: [opensphere-supabase-recovery-backup]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dupa-security-red-test-cronjob
  namespace: opensphere-console-data
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dupa-security-red-test-cronjob }
subjects:
  - kind: ServiceAccount
    name: opensphere-console-dupa-controller
    namespace: opensphere-console
---
# Console-wide evidence is read-only.  Runtime mutation is constrained to the
# namespace Role above; no data-stack installer or claim reconciler exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: dupa-console-evidence-reader }
rules:
  - { apiGroups: [""], resources: [namespaces], verbs: [get, list] }
  - { apiGroups: ["config.opensphere.io"], resources: [platformconfigs], verbs: [get, list] }
  - { apiGroups: ["platform.opensphere.io"], resources: [platformversions], verbs: [get, list] }
  - { apiGroups: ["networking.k8s.io"], resources: [networkpolicies], verbs: [get, list] }
  - { apiGroups: ["admissionregistration.k8s.io"], resources: [validatingwebhookconfigurations], verbs: [get, list] }
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames:
      - opensphere-console-manual-ui-contract
      - opensphere-console-image-integrity-workload
      - opensphere-console-image-integrity-cronjob
    verbs: [get]
  - { apiGroups: ["rbac.authorization.k8s.io"], resources: [clusterrolebindings], verbs: [get, list] }
  - { apiGroups: ["observability.opensphere.io"], resources: [observabilitybindings], verbs: [get, list] }
  - apiGroups: ["pkg.crossplane.io"]
    resources: [providers]
    resourceNames: [crossplane-contrib-provider-helm]
    verbs: [get]
  - apiGroups: ["helm.crossplane.io"]
    resources: [providerconfigs]
    resourceNames: [default]
    verbs: [get]
  # PFS establishment is a live read projection. The DUPA controller never
  # creates or mutates Foundation contracts; the Foundation control plane owns
  # their status and consumer-protect finalizers.
  - apiGroups: ["foundation.opensphere.io"]
    resources:
      - foundationmodels
      - foundationmoduledescriptors
      - foundationclaims
      - foundationbindings
      - identitydirectoryclaims
      - identitydirectorybindings
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    resourceNames: [foundation-control-plane]
    verbs: [get]
  - { apiGroups: ["authentication.k8s.io"], resources: [tokenreviews], verbs: [create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: dupa-console-evidence-reader }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dupa-console-evidence-reader }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-dupa-controller, namespace: opensphere-console }
---
# Delivery evidence is strictly namespaced and read-only.  This avoids turning
# the Console controller into a second Argo CD administrator while still
# proving the exact control-plane and Application that own GitOps delivery.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-platform-delivery-evidence-reader
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: [applications, appprojects]
    resourceNames: [opensphere-platform-delivery-verify, opensphere-platform-delivery]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [deployments]
    resourceNames: [argocd-repo-server, argocd-server, argocd-applicationset-controller]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [statefulsets]
    resourceNames: [argocd-application-controller]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-platform-delivery-evidence-reader
  namespace: argocd
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-platform-delivery-evidence-reader }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-dupa-controller, namespace: opensphere-console }
---
# Crossplane is an optional SRL-L4 adapter. Once selected, its fixed control
# plane and approved Provider become part of Delivery readiness.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-crossplane-evidence-reader
  namespace: crossplane-system
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    resourceNames: [crossplane]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-crossplane-evidence-reader
  namespace: crossplane-system
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-crossplane-evidence-reader }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-dupa-controller, namespace: opensphere-console }
---
# 승인된 module permission profile은 설치 시 고정 생성한다. Controller가 ClusterRole을 생성하지 않아
# Kubernetes privilege-escalation admission 경계를 우회하지 않는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensphere-module-cluster-observer-v1
  labels: { opensphere.io/managed-by: dupa }
rules:
