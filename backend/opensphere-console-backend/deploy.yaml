# opensphere-console-backend — 콘솔 stateless API 통합(구 console-identity-api + opensphere-catalog-api).
# 셸 nginx: /api/identity·/api/catalog·/api/kubernetes → 이 단일 서비스.
apiVersion: v1
kind: Namespace
metadata:
  name: opensphere-oaa-credentials
  labels:
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/scope: oaa-provider-credentials
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: opensphere-console-backend, namespace: opensphere-console }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensphere-local-edge-release
  namespace: opensphere-console
  labels:
    opensphere.io/purpose: local-edge-release-automation
automountServiceAccountToken: false
---
# catalog: CRD·deployment read (cluster)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: opensphere-console-backend }
rules:
  - { apiGroups: ["apiextensions.k8s.io"], resources: ["customresourcedefinitions"], verbs: ["get", "list"] }
  - { apiGroups: [""], resources: ["nodes", "pods", "namespaces"], verbs: ["get", "list"] }
  - { apiGroups: ["apps"], resources: ["deployments", "statefulsets", "daemonsets"], verbs: ["get", "list"] }
  - { apiGroups: ["authentication.k8s.io"], resources: ["tokenreviews"], verbs: ["create"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: opensphere-console-backend }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: opensphere-console-backend }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# The browser-facing Backend may read the managed installation lock. It cannot
# create executor Jobs or mutate general release resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-installation-lock, namespace: opensphere-console }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["opensphere-installation-lock"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-installation-lock, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-installation-lock }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# Local-edge Foundation publication uses the same short, audience-bound
# opensphere-local-edge-release TokenReview authority as Platform Release. The
# formal owner operation can read the development trust key and CAS-patch only
# the dedicated Foundation owner Deployment; it cannot mutate the DUPA-managed
# Foundation package or any other workload.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-foundation-owner-release, namespace: opensphere-console }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dupa-trusted-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-foundation-owner-release, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-foundation-owner-release }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# Recovery evidence is a single non-secret status ConfigMap. The Backend has
# no list, watch, or write authority in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-recovery-evidence, namespace: opensphere-console }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["opensphere-platform-recovery-evidence"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-recovery-evidence, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-recovery-evidence }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# Upgrade revocation: retain the legacy Role name in the Console namespace with
# no rules so a normal apply removes its former namespace-wide Secret custody.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-oaa-credentials, namespace: opensphere-console }
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-oaa-credentials, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-oaa-credentials }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# OAA provider credential custody. The Console Backend is the authenticated
# policy/audit enforcement point; its code allowlists only `oaa-llm-<id>`
# Secrets carrying the OAA label. Provider credentials are isolated from every
# Console runtime/auth/TLS Secret; the OAA Gateway remains a read-only consumer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-oaa-credentials, namespace: opensphere-oaa-credentials }
rules:
  - { apiGroups: [""], resources: ["secrets"], verbs: ["get", "list", "create", "patch", "update", "delete"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-oaa-credentials, namespace: opensphere-oaa-credentials }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-oaa-credentials }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# identity: Console Identity API runtime (Supabase-verified tokens in canonical mode)
apiVersion: apps/v1
kind: Deployment
metadata: { name: opensphere-console-backend, namespace: opensphere-console, labels: { app: opensphere-console-backend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: opensphere-console-backend } }
  template:
    metadata: { labels: { app: opensphere-console-backend } }
    spec:
      # The Backend is stateless. Spread its two replicas across host failure
      # domains without inventing HA for the separate RWO data plane.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: opensphere-console-backend } }
      serviceAccountName: opensphere-console-backend
      imagePullSecrets: [{ name: opensphere-ghcr-pull }]
      containers:
        - name: api
          # 실배포 기준: 현재 검증된 로컬 런타임 이미지.
          image: ghcr.io/opensphere-platform/opensphere-console-backend@sha256:8ff3652e8087e57c9e150e1b4a59ac64e19c7330cae6234d454f85075fb42e84
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: installation-policy
              mountPath: /var/run/opensphere-installation
              readOnly: true
            - name: shell-credential-authority-tls
              mountPath: /var/run/opensphere-shell-credential-authority
              readOnly: true
            - name: platform-release-authority-tls
              mountPath: /var/run/opensphere-platform-release-authority
              readOnly: true
          env:
            - { name: APP_VERSION, value: "0.8.0-oaa-recovery-owner" }
            # fetch(kube API / secret read)가 kube CA 신뢰하도록
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: OAA_NAMESPACE, value: opensphere-console }
            - { name: OAA_KEY_NAMESPACE, value: opensphere-oaa-credentials }
            - { name: OAA_EMBED_DIM, value: "1536" }
            - { name: OAA_ALLOWED_NAMESPACES, value: "opensphere-console,opensphere-console-data,opensphere-console-change" }
            - { name: OAA_SCALE_MAX, value: "10" }
            # Reviewed durable operations are enabled by operator acceptance.
            # Engineering source mutation remains an independent closed gate.
            - { name: R2D2_DURABLE_OPERATION_ENABLED, value: "true" }
            - { name: R2D2_ENGINEERING_PROPOSAL_ENABLED, value: "false" }
            - { name: R2D2_ENGINEERING_PROPOSAL_REPOSITORIES, value: "" }
            - { name: R2D2_ENGINEERING_EXECUTION_ENABLED, value: "false" }
            # CBSS remains fail-closed/default-off until the control/runtime
            # exact-digest release and four separated internal TLS leaves are installed.
            - { name: OS_SHELL_ADMISSION_ENABLED, value: "false" }
            - { name: OS_SHELL_CREDENTIAL_AUTHORITY_ENABLED, value: "false" }
            - { name: OS_SHELL_CREDENTIAL_AUTHORITY_CERT_FILE, value: /var/run/opensphere-shell-credential-authority/tls.crt }
            - { name: OS_SHELL_CREDENTIAL_AUTHORITY_KEY_FILE, value: /var/run/opensphere-shell-credential-authority/tls.key }
            - { name: PLATFORM_RELEASE_AUTHORITY_ENABLED, value: "true" }
            - { name: PLATFORM_RELEASE_AUTHORITY_CERT_FILE, value: /var/run/opensphere-platform-release-authority/tls.crt }
            - { name: PLATFORM_RELEASE_AUTHORITY_KEY_FILE, value: /var/run/opensphere-platform-release-authority/tls.key }
            - name: OS_SHELL_ADMISSION_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-shell-control-runtime, key: admission-secret, optional: true } }
            - name: OS_SHELL_DELEGATION_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-shell-control-runtime, key: delegation-secret, optional: true } }
            - { name: OAA_GATEWAY_URL, value: "http://opensphere-console-oaa-gateway.opensphere-console.svc.cluster.local:8080" }
            - { name: DUPA_CONTROL_URL, value: "http://opensphere-console-dupa-controller.opensphere-console.svc.cluster.local:8080" }
            # ADR-006 canonical runtime mode.
            - { name: AUTH_PROVIDER, value: supabase }
            - { name: SUPABASE_AUTH_URL, value: "http://opensphere-supabase-auth.opensphere-console-data.svc.cluster.local:9999" }
            - { name: SUPABASE_AUTH_ISSUER, value: "https://localhost:1114/auth/v1" }
            - { name: SUPABASE_AUTH_AUDIENCE, value: authenticated }
            - { name: SUPABASE_REQUIRE_AAL2, value: "true" }
            - { name: CONSOLE_PUBLIC_URL, value: "https://localhost:1114" }
            - { name: CLI_SESSION_TTL_SEC, value: "900" }
            - { name: CLI_PAT_TTL_SEC, value: "2592000" }
            - name: CLI_JWT_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-console-cli-runtime, key: jwt-secret } }
            - { name: SUPABASE_BACKEND_DB_ROLE, value: opensphere_console_backend }
            - { name: SUPABASE_REST_URL, value: "http://opensphere-supabase-rest.opensphere-console-data.svc.cluster.local:3000" }
            - { name: SUPABASE_STORAGE_URL, value: "http://opensphere-supabase-storage.opensphere-console-data.svc.cluster.local:5000" }
            - { name: BESZEL_URL, value: "http://beszel-hub.opensphere-monitoring.svc.cluster.local:8090" }
            - name: BESZEL_READER_EMAIL
              valueFrom: { secretKeyRef: { name: opensphere-baseline-monitoring-reader, key: email, optional: true } }
            - name: BESZEL_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: opensphere-baseline-monitoring-reader, key: password, optional: true } }
            - name: BESZEL_WEBHOOK_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-baseline-monitoring-reader, key: webhook-token, optional: true } }
            # Declarative Change Authority. Values are projected only into the
            # Console Backend; browser, OAA and Gitea repository contents never
            # receive this scoped token or the webhook/reconciler credentials.
            - { name: GITEA_URL, value: "http://opensphere-gitea.opensphere-console-change.svc.cluster.local:3000" }
            - { name: GITEA_ORGANIZATION, value: opensphere }
            - { name: GITEA_REPOSITORY, value: platform-declarations }
            - { name: GITEA_DEFAULT_BRANCH, value: main }
            - { name: GITEA_RECONCILER_NAME, value: oaa-governed-adapter }
            - { name: GITEA_RECONCILER_NAMES, value: "oaa-governed-adapter,ceph-prerequisite-reconciler,foundation-bootstrap-reconciler,platform-release-reconciler,foundation-owner-release-reconciler" }
            - { name: GITEA_CHANGE_REQUIRE_AAL2, value: "true" }
            - { name: GITEA_REQUIRE_VERIFIED_MERGE, value: "true" }
            - name: GITEA_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: token } }
            - name: GITEA_REVIEW_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: review-token } }
            - name: GITEA_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: webhook-secret } }
            - name: RECONCILER_RECEIPT_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: reconciler-token } }
            - name: SUPABASE_JWT_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-supabase-runtime, key: jwt-secret } }
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom: { secretKeyRef: { name: opensphere-supabase-runtime, key: service-role-key } }
            - name: BROWSER_SESSION_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: opensphere-supabase-runtime, key: browser-session-key } }
            # Outbound notification credentials are passed once to the internal
            # Dispatcher. The Backend never reads the encrypted secret ledger.
            - { name: NOTIFICATION_DISPATCHER_URL, value: "http://opensphere-notification-dispatcher.opensphere-console.svc.cluster.local:8081" }
            - { name: NOTIFICATION_REQUIRE_AAL2, value: "true" }
            - name: NOTIFICATION_DISPATCHER_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-notification-runtime, key: internal-token } }
            - name: NOTIFICATION_EVENT_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-notification-runtime, key: event-token } }
            # External backup execution is isolated from notification delivery:
            # separate service, DB role, internal token and encryption keys.
            - { name: EXTERNAL_CHANNEL_EXECUTOR_URL, value: "http://opensphere-external-channel-executor.opensphere-console.svc.cluster.local:8082" }
            - { name: EXTERNAL_CHANNEL_REQUIRE_AAL2, value: "true" }
            - name: EXTERNAL_CHANNEL_EXECUTOR_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-external-channel-runtime, key: internal-token } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: shell-cred-tls, containerPort: 8444 }
            - { name: release-tls, containerPort: 8446 }
          # Serving readiness keeps the native management and diagnostic surface
          # routable while /readyz reports dependency degradation in detail.
          readinessProbe: { httpGet: { path: /serving-readyz, port: 8080 }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: installation-policy
          configMap:
            name: opensphere-installation-lock
            optional: true
        - name: shell-credential-authority-tls
          secret:
            secretName: opensphere-shell-credential-authority-tls
            optional: true
        - name: platform-release-authority-tls
          secret:
            secretName: opensphere-platform-release-authority-tls
            optional: false
---
apiVersion: v1
kind: Service
metadata: { name: opensphere-console-backend, namespace: opensphere-console, labels: { app: opensphere-console-backend } }
spec:
  selector: { app: opensphere-console-backend }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: opensphere-platform-release-authority
  namespace: opensphere-console
  labels: { app: opensphere-platform-release-authority }
spec:
  selector: { app: opensphere-console-backend }
  ports: [{ name: https, port: 8446, targetPort: release-tls }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: opensphere-platform-release-authority-tls-writer }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "configmaps"]
  validations:
    - expression: >-
        !(
          request.namespace == 'opensphere-console'
          && request.name in [
            'opensphere-platform-release-authority-tls','opensphere-platform-release-control-ca'
          ]
        ) || (
          request.operation == 'CREATE'
          && request.userInfo.username in [
            'system:serviceaccount:opensphere-console:platform-release-executor',
            'system:serviceaccount:opensphere-console:platform-release-tls-initializer'
          ]
          && object.metadata.namespace == 'opensphere-console'
          && size(object.metadata.labels) == 1
          && object.metadata.labels['opensphere.io/purpose'] in [
            'platform-release-internal-tls','platform-release-internal-ca'
          ]
          && object.immutable == true
          && (
            (
              object.kind == 'Secret'
              && object.metadata.name == 'opensphere-platform-release-authority-tls'
              && object.metadata.labels['opensphere.io/purpose'] == 'platform-release-internal-tls'
              && object.type == 'kubernetes.io/tls'
              && object.data.all(k, k in ['ca.crt','tls.crt','tls.key'])
              && size(object.data) == 3
            ) || (
              object.kind == 'ConfigMap'
              && object.metadata.name == 'opensphere-platform-release-control-ca'
              && object.metadata.labels['opensphere.io/purpose'] == 'platform-release-internal-ca'
              && object.data.all(k, k == 'ca.crt')
              && size(object.data) == 1
            )
          )
        )
      message: Platform Release TLS custody objects are create-only and executor-owned.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: opensphere-platform-release-authority-tls-writer }
spec:
  policyName: opensphere-platform-release-authority-tls-writer
  validationActions: [Deny]
---
# Bootstrap A applies this complete backend-owned manifest through the old
# component selector. This one-shot identity may create only the immutable
# TLS pair and validates/reuses it across response loss or Pod replacement.
apiVersion: v1
kind: ServiceAccount
metadata: { name: platform-release-tls-initializer, namespace: opensphere-console }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: platform-release-tls-initializer, namespace: opensphere-console }
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["opensphere-platform-release-authority-tls"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["opensphere-platform-release-control-ca"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["opensphere-platform-release-authority"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: platform-release-tls-initializer, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-release-tls-initializer }
subjects:
  - { kind: ServiceAccount, name: platform-release-tls-initializer, namespace: opensphere-console }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: platform-release-tls-initializer-custody }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "configmaps", "services"]
  validations:
    - expression: >-
        request.userInfo.username
          != 'system:serviceaccount:opensphere-console:platform-release-tls-initializer'
        || (
          request.operation == 'CREATE'
          && request.namespace == 'opensphere-console'
          && (
            (object.kind == 'Secret'
              && object.metadata.name == 'opensphere-platform-release-authority-tls')
            || (object.kind == 'ConfigMap'
              && object.metadata.name == 'opensphere-platform-release-control-ca')
            || (object.kind == 'Service'
              && object.metadata.name == 'opensphere-platform-release-authority'
              && size(object.metadata.labels) == 1
              && object.metadata.labels['app'] == 'opensphere-platform-release-authority'
              && object.spec.selector == {'app':'opensphere-console-backend'}
              && object.spec.type == 'ClusterIP'
              && (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)
              && (!has(object.spec.externalName) || object.spec.externalName == '')
              && !has(object.spec.loadBalancerClass)
              && size(object.spec.ports) == 1
              && object.spec.ports[0].name == 'https'
              && object.spec.ports[0].port == 8446
              && object.spec.ports[0].protocol == 'TCP'
              && object.spec.ports[0].targetPort == 'release-tls'
              && (!has(object.spec.ports[0].appProtocol))
              && (!has(object.spec.ports[0].nodePort) || object.spec.ports[0].nodePort == 0)
              && object.spec.clusterIP != 'None'
              && size(object.spec.clusterIPs) == 1
              && object.spec.clusterIPs[0] == object.spec.clusterIP
              && size(object.spec.ipFamilies) == 1
              && object.spec.ipFamilyPolicy == 'SingleStack'
              && object.spec.internalTrafficPolicy == 'Cluster'
              && object.spec.sessionAffinity == 'None'
              && (!has(object.spec.sessionAffinityConfig))
              && (!has(object.spec.publishNotReadyAddresses)
                || !object.spec.publishNotReadyAddresses)
              && (!has(object.spec.externalTrafficPolicy)
                || object.spec.externalTrafficPolicy == 'Cluster')
              && (!has(object.spec.healthCheckNodePort)
                || object.spec.healthCheckNodePort == 0)
              && (!has(object.spec.loadBalancerIP) || object.spec.loadBalancerIP == ''))
          )
        )
      message: Platform Release TLS initializer may create only its exact authority resources.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: opensphere-platform-release-authority-service-custody }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["services"]
  validations:
    - expression: >-
        !(
          request.namespace == 'opensphere-console'
          && request.name == 'opensphere-platform-release-authority'
        ) || (
          (
            (request.operation == 'CREATE'
              && request.userInfo.username in [
                'system:serviceaccount:opensphere-console:platform-release-tls-initializer',
                'system:serviceaccount:opensphere-console:platform-release-executor'
              ])
            || (request.operation == 'UPDATE'
              && request.userInfo.username
                == 'system:serviceaccount:opensphere-console:platform-release-executor')
          )
          && object.kind == 'Service'
          && object.metadata.namespace == 'opensphere-console'
          && object.metadata.name == 'opensphere-platform-release-authority'
          && size(object.metadata.labels) == 1
          && object.metadata.labels['app'] == 'opensphere-platform-release-authority'
          && object.spec.selector == {'app':'opensphere-console-backend'}
          && object.spec.type == 'ClusterIP'
          && (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)
          && (!has(object.spec.externalName) || object.spec.externalName == '')
          && !has(object.spec.loadBalancerClass)
