# The Foundation release workers carry short-lived projected identity tokens
# and a repository-read token. Isolate both selectors and permit only DNS,
# the local Docker Desktop API service, Backend reconcile endpoints and the
# one private declarations repository. The executor additionally observes the
# one Foundation owner endpoint after applying the exact workload digest.
