# opensphere-console-backend — Console identity와 Developer Catalog projection을 제공하는 stateless API.
# 셸 nginx: /api/identity·/api/catalog·/api/kubernetes → 이 단일 서비스.
apiVersion: v1
kind: Namespace
metadata:
  name: opensphere-osaa-credentials
  labels:
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/scope: osaa-provider-credentials
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: opensphere-console-backend, namespace: opensphere-console }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensphere-local-edge-release
  namespace: opensphere-console
  labels:
    opensphere.io/purpose: local-edge-release-automation
automountServiceAccountToken: false
---
# catalog: CRD·deployment read (cluster)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: opensphere-console-backend }
rules:
  - { apiGroups: ["apiextensions.k8s.io"], resources: ["customresourcedefinitions"], verbs: ["get", "list"] }
  - { apiGroups: [""], resources: ["nodes", "pods", "namespaces"], verbs: ["get", "list"] }
  - { apiGroups: ["apps"], resources: ["deployments", "statefulsets", "daemonsets"], verbs: ["get", "list"] }
  - { apiGroups: ["authentication.k8s.io"], resources: ["tokenreviews"], verbs: ["create"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: opensphere-console-backend }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: opensphere-console-backend }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# OSDST mode is a four-stage runtime policy, not a browser-only flag.
# Backend may mutate only the OSDST Deployment pod-template annotation;
# the annotation is durable desired state and changing it causes one bounded rollout.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-osaa-dialogue-state, namespace: opensphere-console }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["opensphere-osdst"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-osaa-dialogue-state, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-osaa-dialogue-state }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# The browser-facing Backend may read only the managed installation lock. It
# cannot apply release resources or create executor Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-installation-lock, namespace: opensphere-console }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["opensphere-installation-lock"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-installation-lock, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-installation-lock }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# Recovery evidence is a single non-secret status ConfigMap. The Backend has
# no list, watch, or write authority in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-recovery-evidence, namespace: opensphere-console }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["opensphere-platform-recovery-evidence"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-recovery-evidence, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-recovery-evidence }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# Recovery executor readiness is derived from two exact suspended CronJob
# templates. The Backend cannot list Jobs, read logs, or mutate this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-recovery-template-reader, namespace: opensphere-console-recovery }
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [opensphere-supabase-recovery-drill, opensphere-gitea-recovery-drill]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-recovery-template-reader, namespace: opensphere-console-recovery }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-recovery-template-reader }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# Upgrade revocation: retain the legacy Role name in the Console namespace with
# no rules so a normal apply removes its former namespace-wide Secret custody.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-osaa-credentials, namespace: opensphere-console }
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-osaa-credentials, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-osaa-credentials }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# OSAA provider credential custody. The Console Backend is the authenticated
# policy/audit enforcement point; its code allowlists only `osaa-llm-<id>`
# Secrets carrying the OSAA label. Provider credentials are isolated from every
# Console runtime/auth/TLS Secret; the OSAA Gateway remains a read-only consumer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opensphere-console-backend-osaa-credentials, namespace: opensphere-osaa-credentials }
rules:
  - { apiGroups: [""], resources: ["secrets"], verbs: ["get", "list", "create", "patch", "update", "delete"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opensphere-console-backend-osaa-credentials, namespace: opensphere-osaa-credentials }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensphere-console-backend-osaa-credentials }
subjects:
  - { kind: ServiceAccount, name: opensphere-console-backend, namespace: opensphere-console }
---
# identity: Console Identity API runtime (Supabase-verified tokens in canonical mode)
apiVersion: apps/v1
kind: Deployment
metadata: { name: opensphere-console-backend, namespace: opensphere-console, labels: { app: opensphere-console-backend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: opensphere-console-backend } }
  template:
    metadata: { labels: { app: opensphere-console-backend } }
    spec:
      # The Backend is stateless. Spread its two replicas across host failure
      # domains without inventing HA for the separate RWO data plane.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: opensphere-console-backend } }
      serviceAccountName: opensphere-console-backend
      imagePullSecrets: [{ name: opensphere-ghcr-pull }]
      containers:
        - name: api
          # 실배포 기준: 현재 검증된 로컬 런타임 이미지.
          image: ghcr.io/opensphere-platform/opensphere-console-backend@sha256:8ff3652e8087e57c9e150e1b4a59ac64e19c7330cae6234d454f85075fb42e84
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: installation-policy
              mountPath: /var/run/opensphere-installation
              readOnly: true
            - name: shell-credential-authority-tls
              mountPath: /var/run/opensphere-shell-credential-authority
              readOnly: true
          env:
            - { name: APP_VERSION, value: "202608230312" }
            # fetch(kube API / secret read)가 kube CA 신뢰하도록
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: OSAA_NAMESPACE, value: opensphere-console }
            - { name: OSAA_KEY_NAMESPACE, value: opensphere-osaa-credentials }
            - { name: OSAA_EMBED_DIM, value: "1536" }
            - { name: OSAA_ALLOWED_NAMESPACES, value: "opensphere-console,opensphere-console-data,opensphere-console-change" }
            - { name: OSAA_SCALE_MAX, value: "10" }
            # Reviewed durable operations and exact patch-bound local edge
            # Engineering Remediation are enabled by operator acceptance. The
            # execution path remains closed until a fresh Repair Runner lease is
            # visible; no static worker-ready override exists.
            - { name: R2D2_DURABLE_OPERATION_ENABLED, value: "true" }
            - { name: R2D2_ENGINEERING_PROPOSAL_ENABLED, value: "true" }
            - { name: R2D2_ENGINEERING_PROPOSAL_REPOSITORIES, value: "console" }
            - { name: R2D2_ENGINEERING_EXECUTION_ENABLED, value: "true" }
            # OS Shell owns these durable feature gates. If its ConfigMap is absent,
            # optional key projection omits the variables and Backend remains
            # fail-closed/default-off. A Backend-only apply must never reset an
            # already installed OS Shell to false.
            - name: OS_SHELL_ADMISSION_ENABLED
              valueFrom: { configMapKeyRef: { name: opensphere-shell-control-gates, key: admission-enabled, optional: true } }
            - name: OS_SHELL_CREDENTIAL_AUTHORITY_ENABLED
              valueFrom: { configMapKeyRef: { name: opensphere-shell-control-gates, key: credential-authority-enabled, optional: true } }
            - { name: OS_SHELL_CREDENTIAL_AUTHORITY_CERT_FILE, value: /var/run/opensphere-shell-credential-authority/tls.crt }
            - { name: OS_SHELL_CREDENTIAL_AUTHORITY_KEY_FILE, value: /var/run/opensphere-shell-credential-authority/tls.key }
            - name: OS_SHELL_ADMISSION_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-shell-control-runtime, key: admission-secret, optional: true } }
            - name: OS_SHELL_DELEGATION_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-shell-control-runtime, key: delegation-secret, optional: true } }
            - { name: OSAA_GATEWAY_URL, value: "http://opensphere-console-osaa-gateway.opensphere-console.svc.cluster.local:8080" }
            - { name: OSDST_URL, value: "http://opensphere-osdst.opensphere-console.svc.cluster.local:8080" }
            - { name: DUPA_CONTROL_URL, value: "http://opensphere-console-dupa-controller.opensphere-console.svc.cluster.local:8080" }
            # ADR-006 canonical runtime mode.
            - { name: AUTH_PROVIDER, value: supabase }
            - { name: SUPABASE_AUTH_URL, value: "http://opensphere-supabase-auth.opensphere-console-data.svc.cluster.local:9999" }
            - { name: SUPABASE_AUTH_ISSUER, value: "https://localhost:1114/auth/v1" }
            - { name: SUPABASE_AUTH_AUDIENCE, value: authenticated }
            - { name: SUPABASE_REQUIRE_AAL2, value: "true" }
            - { name: CONSOLE_PUBLIC_URL, value: "https://localhost:1114" }
            - { name: CLI_SESSION_TTL_SEC, value: "900" }
            - { name: CLI_PAT_TTL_SEC, value: "2592000" }
            - name: CLI_JWT_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-console-cli-runtime, key: jwt-secret } }
            - { name: SUPABASE_BACKEND_DB_ROLE, value: opensphere_console_backend }
            # Operational Intelligence maintenance remains Backend-owned.
            # Dialogue persistence and lease recovery are owned by OSDST.
            - { name: R2D2_MAINTENANCE_ENABLED, value: "true" }
            - { name: R2D2_MAINTENANCE_INTERVAL_MS, value: "86400000" }
            - { name: R2D2_CLUSTER_ID, value: local }
            - { name: SUPABASE_PG_HOST, value: "opensphere-supabase-postgres.opensphere-console-data.svc.cluster.local" }
            - { name: SUPABASE_PG_PORT, value: "5432" }
            - { name: SUPABASE_PG_DATABASE, value: postgres }
            - name: R2D2_MAINTENANCE_PG_USER
              valueFrom: { secretKeyRef: { name: opensphere-osaa-maintenance-runtime, key: operational-pg-user } }
            - name: R2D2_MAINTENANCE_PG_PASSWORD
              valueFrom: { secretKeyRef: { name: opensphere-osaa-maintenance-runtime, key: operational-pg-password } }
            - { name: SUPABASE_REST_URL, value: "http://opensphere-supabase-rest.opensphere-console-data.svc.cluster.local:3000" }
            - { name: SUPABASE_STORAGE_URL, value: "http://opensphere-supabase-storage.opensphere-console-data.svc.cluster.local:5000" }
            - { name: BESZEL_URL, value: "http://beszel-hub.opensphere-monitoring.svc.cluster.local:8090" }
            - name: BESZEL_READER_EMAIL
              valueFrom: { secretKeyRef: { name: opensphere-baseline-monitoring-reader, key: email, optional: true } }
            - name: BESZEL_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: opensphere-baseline-monitoring-reader, key: password, optional: true } }
            - name: BESZEL_WEBHOOK_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-baseline-monitoring-reader, key: webhook-token, optional: true } }
            # Declarative Change Authority. Values are projected only into the
            # Console Backend; browser, OSAA and Gitea repository contents never
            # receive this scoped token or the webhook/reconciler credentials.
            - { name: GITEA_URL, value: "http://opensphere-gitea.opensphere-console-change.svc.cluster.local:3000" }
            - { name: GITEA_ORGANIZATION, value: opensphere }
            - { name: GITEA_REPOSITORY, value: platform-declarations }
            - { name: GITEA_DEFAULT_BRANCH, value: main }
            - { name: GITEA_RECONCILER_NAME, value: osaa-governed-adapter }
            - { name: GITEA_RECONCILER_NAMES, value: "osaa-governed-adapter,ceph-prerequisite-reconciler,foundation-bootstrap-reconciler,platform-release-reconciler" }
            - { name: GITEA_CHANGE_REQUIRE_AAL2, value: "true" }
            - { name: GITEA_REQUIRE_VERIFIED_MERGE, value: "true" }
            - name: GITEA_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: token } }
            - name: GITEA_REVIEW_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: review-token } }
            - name: GITEA_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: webhook-secret } }
            - name: RECONCILER_RECEIPT_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-gitea-control-plane, key: reconciler-token } }
            - name: SUPABASE_JWT_SECRET
              valueFrom: { secretKeyRef: { name: opensphere-supabase-runtime, key: jwt-secret } }
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom: { secretKeyRef: { name: opensphere-supabase-runtime, key: service-role-key } }
            - name: BROWSER_SESSION_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: opensphere-supabase-runtime, key: browser-session-key } }
            # Outbound notification credentials are passed once to the internal
            # Dispatcher. The Backend never reads the encrypted secret ledger.
            - { name: NOTIFICATION_DISPATCHER_URL, value: "http://opensphere-notification-dispatcher.opensphere-console.svc.cluster.local:8081" }
            - { name: NOTIFICATION_REQUIRE_AAL2, value: "true" }
            - name: NOTIFICATION_DISPATCHER_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-notification-runtime, key: internal-token } }
            - name: NOTIFICATION_EVENT_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-notification-runtime, key: event-token } }
            # External backup execution is isolated from notification delivery:
            # separate service, DB role, internal token and encryption keys.
            - { name: EXTERNAL_CHANNEL_EXECUTOR_URL, value: "http://opensphere-external-channel-executor.opensphere-console.svc.cluster.local:8082" }
            - { name: EXTERNAL_CHANNEL_REQUIRE_AAL2, value: "true" }
            - name: EXTERNAL_CHANNEL_EXECUTOR_TOKEN
              valueFrom: { secretKeyRef: { name: opensphere-external-channel-runtime, key: internal-token } }
          ports: [{ name: http, containerPort: 8080 }, { name: shell-cred-tls, containerPort: 8444 }]
          # Serving readiness keeps the native management and diagnostic surface
          # routable while /readyz reports dependency degradation in detail.
          readinessProbe: { httpGet: { path: /serving-readyz, port: 8080 }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: installation-policy
          configMap:
            name: opensphere-installation-lock
            optional: true
        - name: shell-credential-authority-tls
          secret:
            secretName: opensphere-shell-credential-authority-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata: { name: opensphere-console-backend, namespace: opensphere-console, labels: { app: opensphere-console-backend } }
spec:
  selector: { app: opensphere-console-backend }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# Foundation bootstrap is not executed by the browser-facing Backend or the
# Foundation subShell. This dedicated reconciler consumes only reviewed Gitea
# requests for the closed, digest-pinned catalog.
apiVersion: v1
kind: Namespace
metadata: { name: opensphere-system }
---
apiVersion: v1
kind: Namespace
metadata: { name: opensphere-foundation }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: foundation-bootstrap-reconciler, namespace: opensphere-console }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: foundation-bootstrap-reconciler }
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["foundation.opensphere.io"]
    resources: ["foundationmodels", "foundationmoduledescriptors"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["foundation.opensphere.io"]
    resources: ["foundationclaims"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["foundation.opensphere.io"]
    resources: ["foundationbindings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: foundation-bootstrap-reconciler }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: foundation-bootstrap-reconciler }
subjects:
  - { kind: ServiceAccount, name: foundation-bootstrap-reconciler, namespace: opensphere-console }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: foundation-bootstrap-support-profile-reader, namespace: opensphere-console }
rules:
  - apiGroups: ["platform.opensphere.io"]
    resources: ["platformsupportprofiles"]
    resourceNames: ["default"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: foundation-bootstrap-support-profile-reader, namespace: opensphere-console }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: foundation-bootstrap-support-profile-reader }
subjects:
  - { kind: ServiceAccount, name: foundation-bootstrap-reconciler, namespace: opensphere-console }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: foundation-bootstrap-system-installer, namespace: opensphere-system }
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: foundation-bootstrap-system-installer, namespace: opensphere-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: foundation-bootstrap-system-installer }
subjects:
  - { kind: ServiceAccount, name: foundation-bootstrap-reconciler, namespace: opensphere-console }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: foundation-bootstrap-foundation-installer, namespace: opensphere-foundation }
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: foundation-bootstrap-foundation-installer, namespace: opensphere-foundation }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: foundation-bootstrap-foundation-installer }
subjects:
  - { kind: ServiceAccount, name: foundation-bootstrap-reconciler, namespace: opensphere-console }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: foundation-bootstrap-closed-catalog }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apiextensions.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["customresourcedefinitions"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces", "serviceaccounts"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
      - apiGroups: ["foundation.opensphere.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["foundationmodels", "foundationmoduledescriptors", "foundationclaims"]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:opensphere-console:foundation-bootstrap-reconciler'
        || (
          (request.kind.kind == 'CustomResourceDefinition' && object.metadata.name in [
            'foundationmodels.foundation.opensphere.io',
            'foundationmoduledescriptors.foundation.opensphere.io',
            'foundationclaims.foundation.opensphere.io',
            'foundationbindings.foundation.opensphere.io',
            'identitydirectoryclaims.foundation.opensphere.io',
            'identitydirectorybindings.foundation.opensphere.io'
          ])
          || (request.kind.kind == 'Namespace' && object.metadata.name in ['opensphere-system', 'opensphere-foundation'])
          || (request.kind.kind == 'ClusterRole' && object.metadata.name in ['foundation-control-plane-core', 'foundation-control-plane-identity-directory'])
          || (request.kind.kind == 'ClusterRoleBinding' && object.metadata.name in ['foundation-control-plane-core', 'foundation-control-plane-identity-directory'])
          || (request.kind.kind == 'ServiceAccount' && object.metadata.namespace == 'opensphere-system' && object.metadata.name == 'foundation-control-plane')
          || (request.kind.kind == 'Role' && object.metadata.namespace == 'opensphere-foundation' && object.metadata.name == 'foundation-control-plane-deployer')
          || (request.kind.kind == 'RoleBinding' && object.metadata.namespace == 'opensphere-foundation' && object.metadata.name == 'foundation-control-plane-deployer')
          || (request.kind.kind == 'Deployment' && object.metadata.namespace == 'opensphere-system' && object.metadata.name == 'foundation-control-plane')
          || (
            request.kind.kind == 'FoundationModel'
            && request.operation == 'CREATE'
            && object.metadata.name in ['identity', 'data', 'observability']
          )
          || (request.kind.kind == 'FoundationModuleDescriptor' && object.metadata.name == 'identity')
          || (
            request.kind.kind == 'FoundationClaim'
            && object.metadata.namespace == 'opensphere-system'
            && object.metadata.name == 'foundation-bootstrap-observability'
          )
        )
      message: "foundation-bootstrap-reconciler may mutate only the signed closed Foundation catalog"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: foundation-bootstrap-closed-catalog }
spec:
  policyName: foundation-bootstrap-closed-catalog
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundation-bootstrap-reconciler
  namespace: opensphere-console
  labels: { app: foundation-bootstrap-reconciler, app.kubernetes.io/part-of: opensphere-console }
spec:
