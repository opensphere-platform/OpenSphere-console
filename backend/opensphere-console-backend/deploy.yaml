  selector: { matchLabels: { app: platform-release-reconciler } }
  template:
    metadata: { labels: { app: platform-release-reconciler, app.kubernetes.io/part-of: opensphere-console } }
    spec:
      serviceAccountName: platform-release-reconciler
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: opensphere-ghcr-pull }]
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken: { path: token, audience: "https://kubernetes.default.svc", expirationSeconds: 600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
        - name: receipt-identity
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken: { path: token, audience: opensphere-console-platform-release, expirationSeconds: 600 }
        - name: release-control-ca
          configMap:
            name: opensphere-platform-release-control-ca
            items: [{ key: ca.crt, path: ca.crt }]
      containers:
        - name: reconciler
          image: ghcr.io/opensphere-platform/opensphere-console-backend@sha256:8ff3652e8087e57c9e150e1b4a59ac64e19c7330cae6234d454f85075fb42e84
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/opensphere-console-backend/platform-release-reconciler.js"]
          env:
            - { name: PORT, value: "8080" }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: GITEA_ORGANIZATION, value: opensphere }
            - { name: GITEA_REPOSITORY, value: platform-declarations }
            - { name: GITEA_PATH, value: platform-release }
            - { name: EXECUTOR_IMAGE, value: "ghcr.io/opensphere-platform/opensphere-console-backend@sha256:8ff3652e8087e57c9e150e1b4a59ac64e19c7330cae6234d454f85075fb42e84" }
            - { name: IDENTITY_TOKEN_PATH, value: /var/run/secrets/opensphere-platform-release-identity/token }
          volumeMounts:
            - { name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
            - { name: receipt-identity, mountPath: /var/run/secrets/opensphere-platform-release-identity, readOnly: true }
            - { name: release-control-ca, mountPath: /var/run/opensphere-platform-release-control-ca, readOnly: true }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 10m, memory: 40Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
