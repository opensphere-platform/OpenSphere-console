metadata:
  name: foundation-owner-release-reconciler
  namespace: opensphere-console
  labels: { app: foundation-owner-release-reconciler, app.kubernetes.io/part-of: opensphere-console }
spec:
  replicas: 1
  selector: { matchLabels: { app: foundation-owner-release-reconciler } }
  template:
    metadata: { labels: { app: foundation-owner-release-reconciler, app.kubernetes.io/part-of: opensphere-console } }
    spec:
      serviceAccountName: foundation-owner-release-reconciler
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: opensphere-ghcr-pull }]
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken: { path: token, audience: "https://kubernetes.default.svc", expirationSeconds: 600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
        - name: receipt-identity
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken: { path: token, audience: opensphere-console-foundation-owner-release, expirationSeconds: 600 }
        - name: release-control-ca
          configMap:
            name: opensphere-platform-release-control-ca
            items: [{ key: ca.crt, path: ca.crt }]
      containers:
        - name: reconciler
          image: ghcr.io/opensphere-platform/opensphere-console-backend@sha256:8ff3652e8087e57c9e150e1b4a59ac64e19c7330cae6234d454f85075fb42e84
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/opensphere-console-backend/foundation-owner-release-reconciler.js"]
          env:
            - { name: PORT, value: "8080" }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: GITEA_ORGANIZATION, value: opensphere }
            - { name: GITEA_REPOSITORY, value: platform-declarations }
            - { name: GITEA_PATH, value: foundation-owner-release }
            - { name: EXECUTOR_IMAGE, value: "ghcr.io/opensphere-platform/opensphere-console-backend@sha256:8ff3652e8087e57c9e150e1b4a59ac64e19c7330cae6234d454f85075fb42e84" }
