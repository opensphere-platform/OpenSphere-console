  labels:
    app: platform-release-tls-initializer
    opensphere.io/source-revision: __OPENSPHERE_RELEASE_REVISION__
spec:
  parallelism: 1
  completions: 1
  completionMode: NonIndexed
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
