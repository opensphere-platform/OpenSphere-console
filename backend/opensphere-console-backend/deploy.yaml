      serviceAccountName: platform-release-tls-initializer
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets: [{ name: opensphere-ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
