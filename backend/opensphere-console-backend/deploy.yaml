kind: NetworkPolicy
metadata: { name: foundation-owner-release-reconciler, namespace: opensphere-console }
spec:
  podSelector: { matchLabels: { app: foundation-owner-release-reconciler } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 10.96.0.1/32 }
      ports: [{ protocol: TCP, port: 443 }]
    - to:
        - podSelector: { matchLabels: { app: opensphere-console-backend } }
      ports: [{ protocol: TCP, port: 8446 }]
---
