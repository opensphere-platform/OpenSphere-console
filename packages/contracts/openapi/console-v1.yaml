      operationId: deleteRegistryConnection
      tags: [Extensions]
      x-opensphere-requirement: CON-FR-007
      x-opensphere-risk: R2
      x-opensphere-assurance: aal2
      x-opensphere-idempotency: required
      x-opensphere-action: console.registry.connection.remove@1.0
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OperationReason"
        - name: X-OpenSphere-Confirmation
          in: header
          required: true
          schema: { const: "REMOVE opensphere-ghcr" }
      responses:
        "202":
          description: Durable removal operation accepted
          content:
            application/json:
              schema: { $ref: "../schemas/operation-receipt.schema.json" }
        "409": { $ref: "#/components/responses/Conflict" }
