            application/json:
              schema: { $ref: "#/components/schemas/ReadEnvelope" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      operationId: createExtensionRevocation
      tags: [Extensions]
      x-opensphere-requirement: CON-FR-007
      x-opensphere-risk: R2
      x-opensphere-assurance: aal2
      x-opensphere-idempotency: required
      x-opensphere-action: console.extension.revocation.create@1.0
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/registry-revocation-request.schema.json" }
      responses:
        "202":
          description: Revocation intent durably accepted
          content:
            application/json:
              schema: { $ref: "../schemas/operation-receipt.schema.json" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
  /api/admin/extensions/inspect:
    post:
      operationId: inspectExtensionCandidate
      tags: [Extensions]
      x-opensphere-requirement: CON-FR-007
      x-opensphere-risk: R0
      x-opensphere-authority: OpenSphereRegistry
      x-opensphere-permission: console.extension.install
      x-opensphere-idempotency: not-applicable-read-only
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/extension-candidate-request.schema.json" }
      responses:
        "200":
          description: C_REG-bound descriptor, exact execution image, signature, compatibility and provenance evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadEnvelope" }
        "422": { $ref: "#/components/responses/PolicyRejected" }
  /api/admin/extensions/install:
    post:
      operationId: installExtensionCandidate
      tags: [Extensions]
      x-opensphere-requirement: CON-FR-007
      x-opensphere-risk: R2
      x-opensphere-assurance: aal2
      x-opensphere-idempotency: required
      x-opensphere-action: console.extension.install@1.0
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/extension-install-request.schema.json" }
      responses:
        "202":
          description: C_REG-resolved exact-revision install operation durably accepted for independent approval
          content:
            application/json:
              schema: { $ref: "../schemas/operation-receipt.schema.json" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PolicyRejected" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
  /api/admin/extensions/remove:
    post:
      operationId: removeExtension
      tags: [Extensions]
      x-opensphere-requirement: CON-FR-007
      x-opensphere-risk: R2
      x-opensphere-assurance: aal2
      x-opensphere-idempotency: required
