        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/extension-remove-request.schema.json" }
      responses:
        "202":
          description: Registration removal operation durably accepted for independent approval
          content:
            application/json:
              schema: { $ref: "../schemas/operation-receipt.schema.json" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PolicyRejected" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-opensphere-session
    CliBearer:
      type: http
      scheme: bearer
      bearerFormat: OpenSphere opaque 15-minute CLI session
  parameters:
    LoginOrigin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri, maxLength: 2048 }
    CsrfToken:
      name: X-OS-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 512 }
    IdempotencyKey:
      name: X-OS-Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 256 }
    OperationReason:
      name: X-OpenSphere-Reason
      in: header
      required: true
      schema: { type: string, minLength: 3, maxLength: 500 }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ReadEnvelope:
      $ref: "../schemas/read-envelope.schema.json"
    ErrorEnvelope:
      $ref: "../schemas/error-envelope.schema.json"
  responses:
    AuthenticationRequired:
      description: Authentication is missing, expired, or revoked
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PermissionDenied:
      description: Current permission or assurance is insufficient
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    StepUpRequired:
      description: The operation requires successful MFA reauthentication within the preceding five minutes
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: The target is absent or not visible to this actor
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Revision, state, or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PolicyRejected:
      description: A validated request was rejected by current policy
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    AuthorityUnavailable:
      description: The named source authority is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: The bounded verification or mutation rate was exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    EnrollmentExpired:
      description: CLI enrollment lifetime elapsed before browser approval
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
security:
  - BrowserSession: []
