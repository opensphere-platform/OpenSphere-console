openapi: 3.1.0
info:
  title: OpenSphere Console API
  version: 0.1.0
  description: Foundational session, identity, audit, and durable-operation contract slice.
  x-opensphere-status: foundational-slice
servers:
  - url: /
    description: Same-origin Console ingress
tags:
  - name: Session
  - name: Identity
  - name: DataIdentity
  - name: Audit
  - name: Operations
  - name: Extensions
paths:
  /api/identity/bootstrap/status:
    get:
      operationId: getInitialAdministratorBootstrapStatus
      tags: [Identity]
      security: []
      x-opensphere-requirement: CON-FR-001
      x-opensphere-authority: SupabaseAuth
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      responses:
        "200":
          description: Public-safe projection of whether the first Console authority still needs to be claimed
          content:
            application/json:
              schema:
                $ref: "../schemas/initial-administrator-bootstrap-response.schema.json"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
  /api/identity/bootstrap:
    post:
      operationId: bootstrapInitialAdministrator
      tags: [Identity]
      security: []
      x-opensphere-requirement: CON-FR-001
      x-opensphere-authority: SupabaseAuth
      x-opensphere-risk: R1
      x-opensphere-idempotency: single-winner-authority-claim
      parameters:
        - $ref: "#/components/parameters/LoginOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/initial-administrator-bootstrap-request.schema.json"
      responses:
        "201":
          description: Supabase account created and atomically claimed as the first Console administrator
          content:
            application/json:
              schema:
                $ref: "../schemas/initial-administrator-bootstrap-response.schema.json"
        "400":
          $ref: "#/components/responses/PolicyRejected"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
  /api/identity/cli/enrollments:
    post:
      operationId: createCliDeviceEnrollment
      tags: [Identity]
      security: []
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R0
      x-opensphere-idempotency: fresh-five-minute-enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/cli-device-enrollment-request.schema.json" }
      responses:
        "201":
          description: Five-minute browser approval enrollment; only secret digests are persisted
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-enrollment-response.schema.json" }
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AuthorityUnavailable" }
  /api/identity/cli/enrollments/{enrollmentId}:
    parameters:
      - name: enrollmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCliDeviceEnrollment
      tags: [Identity]
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, pattern: "^[A-Fa-f0-9]{8}$" }
      responses:
        "200":
          description: No-secret enrollment projection for the currently authenticated browser subject
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-enrollment-review-response.schema.json" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/identity/cli/enrollments/{enrollmentId}/poll:
    parameters:
      - name: enrollmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: pollCliDeviceEnrollment
      tags: [Identity]
      security: []
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R0
      x-opensphere-idempotency: same-enrollment-read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/cli-device-enrollment-poll-request.schema.json" }
      responses:
        "200":
          description: Enrollment approved and the device identity is available to the CLI
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-enrollment-poll-response.schema.json" }
        "202":
          description: Enrollment remains pending
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-enrollment-poll-response.schema.json" }
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/EnrollmentExpired" }
  /api/identity/cli/enrollments/{enrollmentId}/approve:
    parameters:
      - name: enrollmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveCliDeviceEnrollment
      tags: [Identity]
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R1
      x-opensphere-assurance: recent-aal2
      x-opensphere-idempotency: same-subject-enrollment-cas
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/cli-device-enrollment-approval-request.schema.json" }
      responses:
        "200":
          description: Browser subject approved the P-256 public key; no private key entered Console
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-enrollment-approval-response.schema.json" }
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
  /api/identity/cli/challenge:
    post:
      operationId: createCliDeviceChallenge
      tags: [Identity]
      security: []
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R0
      x-opensphere-idempotency: fresh-one-minute-challenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/cli-device-challenge-request.schema.json" }
      responses:
        "200":
          description: One-minute nonce returned while only its digest is persisted
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-challenge-response.schema.json" }
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
  /api/identity/cli/session:
    post:
      operationId: createCliDeviceSession
      tags: [Identity]
      security: []
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R0
      x-opensphere-idempotency: one-time-challenge-cas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/cli-device-session-request.schema.json" }
      responses:
        "200":
          description: P-256 proof accepted and a fifteen-minute opaque CLI bearer issued
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-session-response.schema.json" }
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/identity/cli/introspect:
    get:
      operationId: introspectCliCredential
      tags: [Identity]
      security:
        - CliBearer: []
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      responses:
        "200":
          description: Current permission and revoke revisions for the fifteen-minute CLI bearer
          content:
            application/json:
              schema: { $ref: "../schemas/cli-credential-introspection-response.schema.json" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
  /api/identity/cli/devices:
    get:
      operationId: listCliDevices
      tags: [Identity]
      security:
        - BrowserSession: []
        - CliBearer: []
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      responses:
        "200":
          description: No-secret CLI device inventory for the current subject
          content:
            application/json:
              schema: { $ref: "../schemas/cli-device-inventory-response.schema.json" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
  /api/identity/cli/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeCliDevice
      tags: [Identity]
      security:
        - BrowserSession: []
        - CliBearer: []
      x-opensphere-requirement: CON-FR-020
      x-opensphere-authority: SupabaseCliDeviceAuthority
      x-opensphere-risk: R1
      x-opensphere-idempotency: repeat-returns-not-found
      parameters:
        - name: X-OS-CSRF-Token
          in: header
          required: false
          description: Required for BrowserSession and ignored for non-ambient CliBearer authentication
          schema: { type: string, minLength: 16, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/cli-device-revocation-request.schema.json" }
      responses:
        "204":
          description: Owned device and all sessions issued to it were atomically revoked
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/identity:
    get:
      operationId: listManagedIdentities
      tags: [Identity]
      x-opensphere-requirement: CON-FR-008
      x-opensphere-authority: SupabaseAuthAndPermissionGrant
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      responses:
        "200":
          description: Current subject only, or the bounded managed directory when console.identity.manage is current
          content:
            application/json:
              schema:
                $ref: "../schemas/managed-identity-directory-response.schema.json"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
  /api/identity/users:
    post:
      operationId: createManagedIdentity
      tags: [Identity]
      x-opensphere-requirement: CON-FR-008
      x-opensphere-authority: SupabaseAuthAndPermissionGrant
      x-opensphere-permission: console.identity.manage
      x-opensphere-risk: R2
      x-opensphere-idempotency: accepted-intent-key
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/managed-identity-create-request.schema.json"
      responses:
        "201":
          description: Supabase Auth subject, closed role grants, audit receipt, and one-time onboarding link were created
          content:
            application/json:
              schema:
                $ref: "../schemas/managed-identity-create-response.schema.json"
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
        "503": { $ref: "#/components/responses/AuthorityUnavailable" }
  /api/identity/users/{subjectId}/group:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: changeManagedIdentityRole
      tags: [Identity]
      x-opensphere-requirement: CON-FR-008
      x-opensphere-authority: SupabasePermissionGrant
      x-opensphere-permission: console.identity.manage
      x-opensphere-risk: R2
      x-opensphere-idempotency: same-role-state-safe
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/managed-identity-role-change-request.schema.json"
      responses:
        "200":
          description: Role markers and their closed permission union committed; target sessions were revoked
          content:
            application/json:
              schema:
                $ref: "../schemas/managed-identity-role-change-response.schema.json"
        "400":
          $ref: "#/components/responses/PolicyRejected"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/StepUpRequired"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
  /api/identity/users/{subjectId}/attrs:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: updateManagedIdentityProfile
      tags: [Identity]
      x-opensphere-requirement: CON-FR-008
      x-opensphere-authority: SupabaseAuthAndCurrentAuthority
      x-opensphere-permission: self-or-console.identity.manage
      x-opensphere-risk: R1
      x-opensphere-idempotency: accepted-intent-key
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/managed-identity-profile-update-request.schema.json"
      responses:
        "200":
          description: Exact Supabase Auth subject profile was updated and completion was audited
          content:
            application/json:
              schema:
                $ref: "../schemas/managed-identity-mutation-response.schema.json"
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
        "503": { $ref: "#/components/responses/AuthorityUnavailable" }
  /api/identity/users/{subjectId}/enabled:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setManagedIdentityEnabled
      tags: [Identity]
      x-opensphere-requirement: CON-FR-008
      x-opensphere-authority: SupabaseAuthAndPermissionGrant
      x-opensphere-permission: console.identity.manage
      x-opensphere-risk: R2
      x-opensphere-idempotency: accepted-intent-key
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/managed-identity-enabled-request.schema.json"
      responses:
        "200":
          description: Supabase Auth enabled state was confirmed and target Console sessions were revoked
          content:
            application/json:
              schema:
                $ref: "../schemas/managed-identity-mutation-response.schema.json"
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
        "503": { $ref: "#/components/responses/AuthorityUnavailable" }
  /api/identity/users/{subjectId}/onboarding:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createManagedIdentityOnboardingLink
      tags: [Identity]
      x-opensphere-requirement: CON-FR-008
      x-opensphere-authority: SupabaseAuthAndPermissionGrant
      x-opensphere-permission: console.identity.manage
      x-opensphere-risk: R2
      x-opensphere-idempotency: one-time-material-not-replayable
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/managed-identity-reason-request.schema.json"
      responses:
        "200":
          description: Same-origin one-time Supabase recovery link was issued for the exact managed subject
          content:
            application/json:
              schema:
                $ref: "../schemas/managed-identity-onboarding-response.schema.json"
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
        "503": { $ref: "#/components/responses/AuthorityUnavailable" }
  /api/identity/users/{subjectId}/mfa/reset:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resetManagedIdentityMfa
      tags: [Identity]
      x-opensphere-requirement: CON-FR-008
      x-opensphere-authority: SupabaseAuthAndPermissionGrant
      x-opensphere-permission: console.identity.manage
      x-opensphere-risk: R2
      x-opensphere-idempotency: accepted-intent-key
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/managed-identity-reason-request.schema.json"
      responses:
        "200":
          description: Exact subject TOTP factors and target Console sessions were removed
          content:
            application/json:
              schema:
                $ref: "../schemas/managed-identity-mfa-reset-response.schema.json"
        "400": { $ref: "#/components/responses/PolicyRejected" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/StepUpRequired" }
        "503": { $ref: "#/components/responses/AuthorityUnavailable" }
  /api/identity/session/preference:
    get:
      operationId: getSessionPreference
      tags: [Session]
      x-opensphere-requirement: CON-FR-001
      x-opensphere-authority: SupabaseAuth
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      responses:
        "200":
          description: Current subject's closed next-login persistence preference
          content:
            application/json:
              schema:
                $ref: "../schemas/session-preference-response.schema.json"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
    put:
      operationId: updateSessionPreference
      tags: [Session]
      x-opensphere-requirement: CON-FR-001
      x-opensphere-authority: SupabaseAuth
      x-opensphere-risk: R1
      x-opensphere-idempotency: same-value-safe
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/session-preference-request.schema.json"
      responses:
        "200":
          description: Preference intent persisted and the same Supabase subject confirmed the update
          content:
            application/json:
              schema:
                $ref: "../schemas/session-preference-response.schema.json"
        "400":
          $ref: "#/components/responses/PolicyRejected"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
  /api/identity/profile/avatar:
    get:
      operationId: getProfileAvatar
      tags: [Identity]
      x-opensphere-requirement: CON-FR-002
      x-opensphere-authority: SupabaseAuth
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      responses:
        "200":
          description: Current subject avatar projection and exact linked-account candidates
          content:
            application/json:
              schema:
                $ref: "../schemas/profile-avatar-response.schema.json"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
    put:
      operationId: selectProfileAvatar
      tags: [Identity]
      x-opensphere-requirement: CON-FR-002
      x-opensphere-authority: SupabaseAuth
      x-opensphere-risk: R1
      x-opensphere-idempotency: same-value-safe
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/profile-avatar-selection-request.schema.json"
      responses:
        "200":
          description: Same-subject Auth metadata confirmed the exact initial or registered linked avatar
          content:
            application/json:
              schema:
                $ref: "../schemas/profile-avatar-response.schema.json"
        "400":
          $ref: "#/components/responses/PolicyRejected"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
  /api/identity/profile/avatar/upload:
    post:
      operationId: uploadProfileAvatar
      tags: [Identity]
      x-opensphere-requirement: CON-FR-002
      x-opensphere-authority: SupabaseAuthAndPrivateStorage
      x-opensphere-risk: R1
      x-opensphere-idempotency: content-digest-same-value-safe
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/profile-avatar-upload-request.schema.json"
      responses:
        "200":
          description: Bounded image stored at the fixed subject path and its digest confirmed in Auth metadata
          content:
            application/json:
              schema:
                $ref: "../schemas/profile-avatar-response.schema.json"
        "400":
          $ref: "#/components/responses/PolicyRejected"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          $ref: "#/components/responses/AuthorityUnavailable"
  /api/identity/profile/avatar/content:
    get:
      operationId: getProfileAvatarContent
      tags: [Identity]
      x-opensphere-requirement: CON-FR-002
      x-opensphere-authority: SupabaseAuthAndPrivateStorage
      x-opensphere-risk: R0
      x-opensphere-idempotency: not-applicable
      parameters:
        - name: v
          in: query
          required: true
          schema:
            type: string
            pattern: "^sha256:[a-f0-9]{64}$"
      responses:
        "200":
          description: Authenticated same-subject image whose bytes, MIME type, and digest match Auth metadata
          headers:
            ETag:
              schema: { type: string }
          content:
            image/webp: { schema: { type: string, format: binary, maxLength: 163840 } }
