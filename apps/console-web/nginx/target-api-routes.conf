    # Atomic target route table
    # C_API: identity, platform, catalog, kubernetes, status, monitoring, remaining admin.
    # C_AI: osaa + manual. C_NOTIFY: notifications. C_BAK: external-channels.
    # C_SCTL: os-shell HTTP + WebSocket. C_EXT: plugin stream + exact management.
    # Retired: proxy, modules, module-operations, legacy admin events/readiness/observability.

    location = /readyz {
        set $console_api_upstream opensphere-console-api.opensphere-console.svc.cluster.local;
        proxy_pass http://$console_api_upstream:8080/healthz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-OS-Correlation-ID $os_correlation_id;
        proxy_intercept_errors on;
        error_page 502 504 = @console_api_unavailable;
    }

    location ~ ^/api/(?:proxy|modules|module-operations)(?:/|$) {
        default_type application/json;
        return 410 '{"schemaVersion":"1.0","code":"RouteRetired","message":"This legacy Console route has been retired."}';
    }
    location = /api/admin/events {
        default_type application/json;
        return 410 '{"schemaVersion":"1.0","code":"RouteRetired","message":"Legacy workload event ingestion has been retired."}';
    }
    location ~ ^/api/admin/(?:platform-readiness|observability)(?:/|$) {
        default_type application/json;
        return 410 '{"schemaVersion":"1.0","code":"RouteRetired","message":"Use the target Backbone readiness or monitoring API."}';
    }

    # These legacy Platform endpoints have no role in the target runtime. The
    # target Gitea bootstrap creates no Backend webhook, typed Owners claim DB
    # work instead of polling HTTP reconcile endpoints, and failed changes are
    # replaced by a new reviewed declaration rather than an unsafe retry.
    location ~ "^/api/platform/(?:gitea/webhook/?|reconcile/(?:next|receipt)/?|changes/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89ab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/retry/?)$" {
        default_type application/json;
        return 410 '{"schemaVersion":"1.0","code":"RouteRetired","message":"This legacy Platform route is not part of the target Console runtime.","retryable":false,"sideEffect":"none"}';
    }

    # The capabilities remain product scope, but no target Owner currently
    # implements them. Make the boundary explicit instead of falling through
    # to C_API's generic 404 or retaining a legacy Backend dependency.
    location ~ "^/api/platform/(?:contracts/?|changes/$|os-shell/feature-state(?:/|$)|releases/local-edge-automation(?:/|$))" {
        default_type application/json;
        add_header Retry-After "5" always;
        return 503 '{"schemaVersion":"1.0","code":"AuthorityUnavailable","reasonCode":"TargetPlatformCapabilityInactive","message":"The requested Platform capability has no active target Owner.","retryable":true,"sideEffect":"none"}';
    }
    location ^~ /api/admin/plugins/ {
        set $owner_original_method $request_method;
        set $owner_original_uri $request_uri;
        auth_request /_extension_management_authn;
        auth_request_set $owner_authorization $upstream_http_x_os_owner_authorization;
        auth_request_set $owner_admission $upstream_http_x_os_owner_admission;
        auth_request_set $owner_csrf_verified $upstream_http_x_os_owner_csrf_verified;
        set $owner_upstream opensphere-extension-controller.opensphere-console.svc.cluster.local;
        proxy_pass http://$owner_upstream:8080$request_uri;
        proxy_set_header Authorization $owner_authorization;
        proxy_set_header X-OS-Owner-Admission $owner_admission;
        proxy_set_header X-OS-Owner-CSRF-Verified $owner_csrf_verified;
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header X-OS-CSRF-Token "";
        proxy_set_header X-OS-CSRF "";
        proxy_set_header X-OS-Internal-Authn-Subrequest "";
        proxy_set_header X-OS-Original-Method "";
        proxy_set_header X-OS-Original-URI "";
        proxy_set_header X-OpenSphere-User "";
        proxy_set_header X-OpenSphere-Groups "";
        proxy_set_header X-OpenSphere-Actor "";
        proxy_set_header X-OS-Id-Token "";
        proxy_set_header X-OS-Correlation-ID $os_correlation_id;
        # Keep proxy_intercept_errors disabled so an active Owner's typed
        # 4xx/500/503 response body and content type pass through unchanged.
        # auth_request failures are generated locally as 500, while DNS/connect
