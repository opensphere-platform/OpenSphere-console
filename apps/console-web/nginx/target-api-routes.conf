    location ~ ^/api/(?:identity(?:/|$)|platform(?:/|$)|catalog(?:/|$)|kubernetes(?:/|$)|status(?:/|$)|monitoring(?:/|$)|admin(?:/|$)) {
        set $console_api_upstream opensphere-console-api.opensphere-console.svc.cluster.local;
        proxy_pass http://$console_api_upstream:8080$request_uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-OpenSphere-User "";
        proxy_set_header X-OpenSphere-Groups "";
        proxy_set_header X-OpenSphere-Actor "";
        proxy_set_header X-OS-Id-Token "";
        proxy_set_header X-OS-Owner-Admission "";
        proxy_set_header X-OS-Owner-CSRF-Verified "";
        proxy_set_header X-OS-Internal-Authn-Subrequest "";
        proxy_set_header X-OS-Original-Method "";
        proxy_set_header X-OS-Original-URI "";
        proxy_set_header X-OS-Correlation-ID $os_correlation_id;
        proxy_intercept_errors on;
        error_page 502 504 = @console_api_unavailable;
    }

    location @console_api_unavailable {
        default_type application/json;
        add_header Retry-After "5" always;
        return 503 '{"schemaVersion":"1.0","code":"AuthorityUnavailable","message":"Console API is unavailable.","retryable":true,"sideEffect":"unknown"}';
    }
    location @optional_owner_unavailable {
        default_type application/json;
        add_header Retry-After "5" always;
        return 503 '{"schemaVersion":"1.0","code":"AuthorityUnavailable","message":"The requested Console owner is not active.","retryable":true,"sideEffect":"unknown"}';
    }
    location @owner_admission_unavailable {
        default_type application/json;
        add_header Retry-After "5" always;
        return 503 '{"schemaVersion":"1.0","code":"AuthorityUnavailable","message":"Console session authority is unavailable.","retryable":true,"sideEffect":"none"}';
    }
