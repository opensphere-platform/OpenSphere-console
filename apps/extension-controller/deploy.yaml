apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
rules:
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginpackages]
    verbs: [get]
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginregistrations]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensphere-extension-controller
subjects:
  - kind: ServiceAccount
    name: opensphere-extension-controller
    namespace: opensphere-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensphere-extension-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensphere-extension-controller
        app.kubernetes.io/part-of: opensphere-console
        opensphere.io/component: C_EXT
    spec:
      serviceAccountName: opensphere-extension-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: opensphere-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: __OPENSPHERE_EXTENSION_CONTROLLER_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: CONSOLE_EXTENSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opensphere-extension-controller-runtime
                  key: database-url
            - name: CONSOLE_REGISTRY_URL
              value: http://opensphere-registry.opensphere-console.svc.cluster.local:8080
            - name: CONSOLE_EXTENSION_NAMESPACE
              value: opensphere-console
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: health }
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
