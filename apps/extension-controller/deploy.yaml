apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
rules:
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginpackages]
    verbs: [get, list, patch]
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginregistrations]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [plugins.opensphere.io]
    resources: [uipluginregistrations/status]
    verbs: [patch]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [opensphere-extension-trusted-keys]
    verbs: [get]
  - apiGroups: ['']
    resources: [serviceaccounts, services]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensphere-extension-controller
subjects:
  - kind: ServiceAccount
    name: opensphere-extension-controller
    namespace: opensphere-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensphere-extension-controller-cli-downloads
rules:
  - apiGroups: [console.opensphere.io]
    resources: [clidownloads]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensphere-extension-controller-cli-downloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensphere-extension-controller-cli-downloads
subjects:
  - kind: ServiceAccount
    name: opensphere-extension-controller
    namespace: opensphere-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensphere-extension-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensphere-extension-controller
        app.kubernetes.io/part-of: opensphere-console
        opensphere.io/component: C_EXT
    spec:
      serviceAccountName: opensphere-extension-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: opensphere-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: __OPENSPHERE_EXTENSION_CONTROLLER_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: CONSOLE_EXTENSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opensphere-extension-controller-runtime
                  key: database-url
            - name: CONSOLE_REGISTRY_URL
              value: http://opensphere-registry.opensphere-console.svc.cluster.local:8080
            - name: CONSOLE_EXTENSION_NAMESPACE
              value: opensphere-console
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: CONSOLE_EXTENSION_LIFECYCLE_ENABLED
              value: 'true'
            - name: CONSOLE_OWNER_AUTHORITY_URL
              value: http://opensphere-console-api.opensphere-console.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: opensphere-extension-controller
  namespace: opensphere-console
  labels:
    app.kubernetes.io/name: opensphere-extension-controller
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/component: C_EXT
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opensphere-extension-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensphere-extension-controller-ingress
  namespace: opensphere-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensphere-extension-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensphere-console-api
        - podSelector:
            matchLabels:
              app: opensphere-console
      ports:
        - { protocol: TCP, port: 8080 }