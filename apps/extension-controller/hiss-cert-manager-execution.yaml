# HISS cert-manager v1.20.0 execution profile, separate from inventory-only admission.
# Inventory SHA-256: 5ac01a06e94ac96f6fcb5019cb24a26c916bdd01c140f01d62ccd7e8c544e86b
# Fixed chart RBAC is provisioned as retained installation prerequisites. Helm uses
# global.rbac.create=false. The CM executor cannot create/edit RBAC, bind or escalate.
# Controller accounts receive only their original fixed chart roles. Those controllers
# necessarily observe certificates/Secrets cluster-wide. The CM executor has direct
# Secret access only in cert-manager. Infrastructure ownership is still privileged;
# current user/session/MFA and the fixed signed chart remain mandatory.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: opensphere-console
    opensphere.io/authority: hiss-cert-manager-v1-20-0
---
