name: Validate Console

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_PASSWORD: console-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Console
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Migration provenance verifies SQL bytes at their original commits.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Verify machine contracts
        run: npm run verify:contracts
      - name: Verify fresh migration manifest
        run: npm run verify:migrations
      - name: Verify fresh Console authority baseline on PostgreSQL
        env:
          PGPASSWORD: console-test
          CONSOLE_MIGRATION_DATABASE_URL: postgresql://postgres:console-test@localhost:5432/postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f migrations/baseline/verify/supabase-test-prerequisites.sql
          node scripts/console-migrations.mjs apply
          node scripts/console-migrations.mjs apply
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f migrations/versions/verify/0011_initial_administrator_bootstrap.verify.sql
          while IFS= read -r verify_path; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f "$verify_path"
          done < <(find migrations/baseline/verify migrations/versions/verify \
            -name '*.verify.sql' ! -name '0011_initial_administrator_bootstrap.verify.sql' -print | sort)
      - name: Verify Console API through PostgreSQL
        env:
          PGPASSWORD: console-test
          CONSOLE_DATABASE_URL: postgresql://console_api_runtime:console-runtime-test@localhost:5432/postgres
          CONSOLE_TEST_ADMIN_DATABASE_URL: postgresql://postgres:console-test@localhost:5432/postgres
          CONSOLE_EXTENSION_DATABASE_URL: postgresql://console_extension_runtime:console-extension-runtime-test@localhost:5432/postgres
        run: |
          npm ci --prefix apps/console-api --no-audit --no-fund
          npm ci --prefix apps/extension-controller --no-audit --no-fund
          node scripts/verify-console-installer-postgres.mjs
          node scripts/verify-console-data-manifest-postgres.mjs
          pwsh -NoProfile -File scripts/verify-console-installer-runtime.ps1
          createdb -h localhost -U postgres opensphere_console_bootstrap_test
          trap 'dropdb --if-exists -h localhost -U postgres opensphere_console_bootstrap_test' EXIT
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d opensphere_console_bootstrap_test -f migrations/baseline/verify/supabase-test-database-prerequisites.sql
          CONSOLE_MIGRATION_DATABASE_URL=postgresql://postgres:console-test@localhost:5432/opensphere_console_bootstrap_test node scripts/console-migrations.mjs apply
          CONSOLE_DATABASE_URL=postgresql://console_api_runtime:console-runtime-test@localhost:5432/opensphere_console_bootstrap_test CONSOLE_TEST_ADMIN_DATABASE_URL=postgresql://postgres:console-test@localhost:5432/opensphere_console_bootstrap_test node scripts/verify-console-api-bootstrap-postgres-e2e.mjs
          node scripts/verify-console-api-postgres-e2e.mjs
      - name: Verify deterministic Manual seed
        run: |
          node scripts/verify-manual-seed.mjs
          node --test scripts/verify-manual-seed.test.mjs
      - name: Test Console contracts and legacy behavior
        run: |
          npm ci --prefix apps/os-shell-control --no-audit --no-fund
          npm run test:console-api
          npm run test:extension-controller
          npm run test:contracts
          npm test
      - name: Build production Web
        run: npm run build -- --configuration production
      - name: Build target Console API image
        run: docker build --file apps/console-api/Dockerfile --tag opensphere-console-api:validation .
      - name: Build OSAA Gateway image
        run: docker build --file apps/osaa-gateway/Dockerfile --tag opensphere-console-osaa-gateway:validation apps/osaa-gateway
      - name: Build target Extension Controller image
        run: docker build --file apps/extension-controller/Dockerfile --tag opensphere-extension-controller:validation .
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cmd/os-cli/go.mod
          cache-dependency-path: |
            cmd/os-cli/go.sum
            backend/registry/go.sum
      - name: Test native CLI and Shell runtime
        working-directory: cmd/os-cli
        run: go test ./...
      - name: Test Registry
        working-directory: backend/registry
        run: go test ./...
